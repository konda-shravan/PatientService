spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:mysql://localhost:3306/patient_service
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: http://localhost:9000

server:
  port: 9000

jwt:
  secret: mySuperSecretKeyForPatientServiceMicroservice
  expiration: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
data:
  redis:
    host: localhost
    port: 6379